<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ランチ候補｜会津若松旅行しおり</title>
<meta name="theme-color" content="#7a2a24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f2ef; --surface: #ffffff; --ink: #1f1c1a; --muted: #6b635d; --hair: #e4dfda;
    --aka: #9e3a2f; --aka-soft: #f6e6e2; --cover: #7a2a24; --kin: #b08a3e; --kin-soft: #f5eedd;
    --serif: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141210; --surface: #1d1a18; --ink: #ece7e2; --muted: #a59c94; --hair: #332e2a;
      --aka: #e28a7e; --aka-soft: #3a221e; --cover: #4a1c18; --kin: #dcb96e; --kin-soft: #2e2818; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.7; }
  a { color: inherit; }
  header { background: var(--cover); color: #fff; padding: max(18px, env(safe-area-inset-top)) 16px 22px; }
  .head-inner { max-width: 640px; margin: 0 auto; }
  .back { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; text-decoration: none; opacity: .9; }
  .back svg { width: 16px; height: 16px; }
  h1 { font-family: var(--serif); font-weight: 900; font-size: 24px; margin: 8px 0 2px; }
  header p { margin: 0; font-size: 14px; opacity: .88; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 12px 48px; }
  h2 { font-family: var(--serif); font-size: 19px; margin: 18px 4px 10px; }
  .decided { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dec { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 12px; }
  .dec .d { font-size: 13px; color: var(--muted); font-weight: 700; }
  .dec .n { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .dec .n.empty { color: var(--muted); font-weight: 500; }
  .shop { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .shop h3 { margin: 0 0 2px; font-size: 17px; }
  .shop .genre { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--kin-soft); color: var(--kin); margin-bottom: 4px; }
  .shop dl { display: grid; grid-template-columns: 5.5em 1fr; gap: 3px 10px; margin: 6px 0 0; font-size: 14px; }
  .shop dt { color: var(--muted); }
  .shop dd { margin: 0; }
  .shop .pick { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--aka); color: #fff; margin-left: 6px; vertical-align: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .actions a { font-size: 13.5px; font-weight: 700; text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--hair); background: var(--paper); }
  .empty-box { border: 1.5px dashed var(--hair); border-radius: 14px; padding: 20px 14px; text-align: center; color: var(--muted); font-size: 14.5px; }
  ul.tips { margin: 0; padding-left: 1.2em; font-size: 14.5px; }
  h3.genre-h { font-family: var(--serif); font-size: 16px; color: var(--aka); margin: 18px 4px 8px; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
  .day { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .day.ok { background: #e5f4e4; color: #2d6a2b; }
  .day.ng { background: var(--aka-soft); color: var(--aka); }
  .day.q { background: var(--kin-soft); color: var(--kin); }
  .memo { margin: 0; font-size: 14px; }
  .foot { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <a class="back" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>しおりに戻る</a>
    <h1>ランチ候補</h1>
    <p>会津若松旅行（11/22〜23）のお昼ごはん</p>
  </div>
</header>

<main>
  <h2>決定</h2>
  <div class="decided">
    <div class="dec"><div class="d">1日目 11/22（日）12:00頃</div><div class="n" id="dec1"></div></div>
    <div class="dec"><div class="d">2日目 11/23（月・祝）12:15頃</div><div class="n" id="dec2"></div></div>
  </div>

  <h2>候補一覧</h2>
  <div id="list"></div>

  <h2>メモ</h2>
  <ul class="tips">
    <li>1日目は12:00ごろ、2日目は12:15ごろの予定。連休なので人気店は早めに</li>
    <li>2日目（23日・月曜祝日）は、月曜定休の店が休みの場合が多い</li>
    <li>2日目はHHTのカフェで食べる案もあり</li>
    <li>営業時間は変わることがあるので、行く前に確認</li>
  </ul>

  <p class="foot">営業時間・定休日は変わることがあります。出かける前に確認してください。</p>
</main>

<script>
(function () {
  // ===== ここを書き換えるとページに反映されます =====
  // pick: 1 か 2 を入れると「決定」に表示（未定は 0）
  // d1 / d2: その日に行けるか（true=営業 / false=休み / null=要確認）
  var GENRES = ['郷土料理・わっぱ飯', 'ソースカツ丼', 'そば', '喜多方ラーメン'];
  var SHOPS = [
    { genre: '郷土料理・わっぱ飯', name: '田季野（たきの）', area: '栄町（市役所近く）',
      hours: '11:00〜（日曜は19:00まで）', closed: '無休', parking: '無料18台',
      memo: 'わっぱ飯の元祖。旧家を移築した店。そばとわっぱ飯の「会津セット」も', d1: true, d2: true, pick: 0 },
    { genre: '郷土料理・わっぱ飯', name: '会津料理 鶴井筒', area: '東山町（会津武家屋敷の前）',
      hours: '要確認', closed: '要確認', parking: '要確認',
      memo: '2日目の武家屋敷・HHTから近い。「会津の味丸かじり膳」1,650円〜', d1: null, d2: null, pick: 0 },
    { genre: '郷土料理・わっぱ飯', name: '渋川問屋', area: '七日町（七日町駅すぐ）',
      hours: '11:00〜15:00（最終入店14:30）', closed: '年中無休', parking: '要確認',
      memo: '明治の海産物問屋の蔵で食べる郷土料理。「祭り御膳」など。昼2,600円〜', tel: '0242-28-4000', d1: true, d2: true, pick: 0 },
    { genre: '郷土料理・わっぱ飯', name: '満田屋（みつたや）', area: '大町（七日町通り近く）',
      hours: '10:30〜16:30', closed: '水曜', parking: '15台',
      memo: '囲炉裏で焼く味噌田楽の店。軽めのお昼や、七日町散策のおやつにも', tel: '0242-27-1345', d1: true, d2: true, pick: 0 },
    { genre: 'ソースカツ丼', name: '白孔雀食堂', area: '宮町',
      hours: '11:00〜15:00', closed: '月・金', parking: '5台',
      memo: '1947年創業。メニューはソースカツ丼のみ、器からはみ出すカツ。名物カツ丼1,600円', d1: true, d2: false, pick: 0 },
    { genre: 'ソースカツ丼', name: 'とん亭', area: '天寧寺町（HHTの近く）',
      hours: '要確認（売り切れ次第終了）', closed: '月曜（ほかにも休みあり）', parking: 'あり',
      memo: '1972年創業のソースかつ専門店。継ぎ足しの特製ソース。馬肉の「八重うまっソースかつ丼」も', tel: '0242-27-2191', d1: true, d2: false, pick: 0 },
    { genre: 'ソースカツ丼', name: 'とんかつ番番', area: '東千石（飯盛山の近く）',
      hours: '11:00〜14:30', closed: '水曜', parking: '要確認',
      memo: '1978年創業のとんかつ専門店。甘めの秘伝ソース、お米は会津産コシヒカリ。特上ソースカツ丼2,400円〜。予約できる。1日目、飯盛山の前に寄りやすい', tel: '0242-27-6327', d1: true, d2: true, pick: 0 },
    { genre: 'ソースカツ丼', name: '卯之家（うのや）', area: '東山温泉（宿の近く）',
      hours: '11:00〜14:00', closed: '月1〜2回の不定休', parking: '要確認',
      memo: 'ソースカツ丼810円。ソースカツ丼・半ラーメン・さくら刺しの「卯之家セット」1,250円で会津名物を一度に', d1: true, d2: true, pick: 0 },
    { genre: 'そば', name: '桐屋・権現亭', area: '上町',
      hours: '11:00〜15:00（土日祝は16:00まで）', closed: '水曜', parking: 'あり',
      memo: '会津屈指のこだわりそば。3種類を食べ比べる「そば三昧」、在来種「会津のかおり」1,760円', d1: true, d2: true, pick: 0 },
    { genre: 'そば', name: '會津おにやんま', area: '慶山（HHTのすぐ近く）',
      hours: '10:00〜15:00', closed: '火・水・金（月ごとに営業日の案内あり）', parking: '要確認',
      memo: '古民家の雰囲気のそば店。すだちそば・だし巻き玉子が人気。そば湯と寒天はセルフ。売り切れることがあるので早めに。2日目のHHTとセットにしやすい', tel: '0242-85-7789', d1: true, d2: true, pick: 0 },
    { genre: '喜多方ラーメン', name: '古川農園', area: '会津若松ICから車で約5分',
      hours: '要確認', closed: '要確認', parking: 'あり',
      memo: 'さっぱり醤油の喜多方ラーメン。高速を降りてすぐなので1日目の到着時に寄りやすい', d1: null, d2: null, pick: 0 },
    { genre: '喜多方ラーメン', name: 'うえんで 本店', area: '大戸町（芦ノ牧温泉駅近く）',
      hours: '9:00〜15:00', closed: '火曜', parking: 'あり',
      memo: '1972年創業。極太ちぢれ麺と会津山塩のラーメン。休日は行列が長いことも。市街から南へ離れている', tel: '0242-92-3253', d1: true, d2: true, pick: 0 }
  ];
  // ===============================================

  function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  function ok(v, label) {
    var cls = v === true ? 'ok' : v === false ? 'ng' : 'q';
    var txt = v === true ? '○' : v === false ? '休み' : '要確認';
    return '<span class="day ' + cls + '">' + label + ' ' + txt + '</span>';
  }
  var list = document.getElementById('list');
  list.innerHTML = GENRES.map(function (g) {
    var items = SHOPS.filter(function (s) { return s.genre === g; });
    if (!items.length) return '';
    return '<h3 class="genre-h">' + esc(g) + '</h3>' + items.map(function (s) {
      var rows = [['場所', s.area], ['営業時間', s.hours], ['定休日', s.closed], ['駐車場', s.parking]]
        .filter(function (r) { return r[1]; })
        .map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('');
      var map = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.name.replace(/（.*?）/g, '') + ' 会津若松');
      var tel = s.tel ? '<a href="tel:' + s.tel.replace(/-/g, '') + '">電話</a>' : '';
      return '<article class="shop">' +
        '<h3>' + esc(s.name) + (s.pick ? '<span class="pick">' + s.pick + '日目</span>' : '') + '</h3>' +
        '<div class="days">' + ok(s.d1, '1日目(日)') + ok(s.d2, '2日目(祝)') + '</div>' +
        '<p class="memo">' + esc(s.memo) + '</p>' +
        '<dl>' + rows + '</dl>' +
        '<div class="actions"><a href="' + map + '">地図</a>' + tel + '</div></article>';
    }).join('');
  }).join('');
  [1, 2].forEach(function (n) {
    var el = document.getElementById('dec' + n);
    var s = SHOPS.filter(function (x) { return x.pick === n; })[0];
    el.textContent = s ? s.name : '未定';
    if (!s) el.classList.add('empty');
  });
})();
</script>
</body>
</html>
