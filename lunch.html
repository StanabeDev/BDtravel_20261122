<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ランチ候補｜会津若松旅行しおり</title>
<meta name="theme-color" content="#7a2a24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f2ef; --surface: #ffffff; --ink: #1f1c1a; --muted: #6b635d; --hair: #e4dfda;
    --aka: #9e3a2f; --aka-soft: #f6e6e2; --cover: #7a2a24; --kin: #b08a3e; --kin-soft: #f5eedd;
    --serif: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141210; --surface: #1d1a18; --ink: #ece7e2; --muted: #a59c94; --hair: #332e2a;
      --aka: #e28a7e; --aka-soft: #3a221e; --cover: #4a1c18; --kin: #dcb96e; --kin-soft: #2e2818; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.7; }
  a { color: inherit; }
  header { background: var(--cover); color: #fff; padding: max(18px, env(safe-area-inset-top)) 16px 22px; }
  .head-inner { max-width: 640px; margin: 0 auto; }
  .back { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; text-decoration: none; opacity: .9; }
  .back svg { width: 16px; height: 16px; }
  h1 { font-family: var(--serif); font-weight: 900; font-size: 24px; margin: 8px 0 2px; }
  header p { margin: 0; font-size: 14px; opacity: .88; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 12px 48px; }
  h2 { font-family: var(--serif); font-size: 19px; margin: 18px 4px 10px; }
  .decided { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dec { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 12px; }
  .dec .d { font-size: 13px; color: var(--muted); font-weight: 700; }
  .dec .n { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .dec .n.empty { color: var(--muted); font-weight: 500; }
  .shop { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .shop h3 { margin: 0 0 2px; font-size: 17px; }
  .shop .genre { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--kin-soft); color: var(--kin); margin-bottom: 4px; }
  .shop dl { display: grid; grid-template-columns: 5.5em 1fr; gap: 3px 10px; margin: 6px 0 0; font-size: 14px; }
  .shop dt { color: var(--muted); }
  .shop dd { margin: 0; }
  .shop .pick { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--aka); color: #fff; margin-left: 6px; vertical-align: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .actions a { font-size: 13.5px; font-weight: 700; text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--hair); background: var(--paper); }
  .empty-box { border: 1.5px dashed var(--hair); border-radius: 14px; padding: 20px 14px; text-align: center; color: var(--muted); font-size: 14.5px; }
  ul.tips { margin: 0; padding-left: 1.2em; font-size: 14.5px; }
  .foot { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <a class="back" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>しおりに戻る</a>
    <h1>ランチ候補</h1>
    <p>会津若松旅行（11/22〜23）のお昼ごはん</p>
  </div>
</header>

<main>
  <h2>決定</h2>
  <div class="decided">
    <div class="dec"><div class="d">1日目 11/22（日）12:00頃</div><div class="n" id="dec1"></div></div>
    <div class="dec"><div class="d">2日目 11/23（月・祝）12:00頃</div><div class="n" id="dec2"></div></div>
  </div>

  <h2>候補一覧</h2>
  <div id="list"></div>

  <h2>メモ</h2>
  <ul class="tips">
    <li>連休なので、人気店は開店直後か予約がおすすめ</li>
    <li>日曜・祝日が休みのお店でないか確認する</li>
  </ul>

  <p class="foot">営業時間・定休日は変わることがあります。出かける前に確認してください。</p>
</main>

<script>
(function () {
  // ===== ここに候補を書き足すとページに表示されます =====
  // day: 1 か 2 を入れると「決定」に表示されます（未定なら 0）
  var SHOPS = [
    // { name: '店名', genre: 'ソースカツ丼', area: '七日町', hours: '11:00〜15:00', closed: '水曜', parking: 'あり', memo: '', map: '店名 会津若松', day: 0 },
  ];
  // ===============================================

  function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  var list = document.getElementById('list');
  if (!SHOPS.length) {
    list.innerHTML = '<div class="empty-box">候補はこれから追加します</div>';
  } else {
    list.innerHTML = SHOPS.map(function (s) {
      var rows = [['場所', s.area], ['営業時間', s.hours], ['定休日', s.closed], ['駐車場', s.parking], ['メモ', s.memo]]
        .filter(function (r) { return r[1]; })
        .map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('');
      var map = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.map || s.name + ' 会津若松');
      return '<article class="shop">' +
        (s.genre ? '<span class="genre">' + esc(s.genre) + '</span>' : '') +
        '<h3>' + esc(s.name) + (s.day ? '<span class="pick">' + s.day + '日目</span>' : '') + '</h3>' +
        (rows ? '<dl>' + rows + '</dl>' : '') +
        '<div class="actions"><a href="' + map + '">地図</a></div></article>';
    }).join('');
  }
  [1, 2].forEach(function (n) {
    var el = document.getElementById('dec' + n);
    var s = SHOPS.filter(function (x) { return x.day === n; })[0];
    el.textContent = s ? s.name : '未定';
    if (!s) el.classList.add('empty');
  });
})();
</script>
</body>
</html>
